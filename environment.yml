channels:
    - conda-forge
    - bioconda
    - rdkit
    - defaults
dependencies:
    - cairosvg
    - python>=3.11
    - biopython
    - pip
    - pulp
    # Match the serialized PARAS model and its tested numerical runtime.
    - scikit-learn=1.8.0
    - numpy=2.4.6
    - scipy=1.16.3
    - joblib=1.5.3
    - pandas>=1.5
    - pyarrow
    - rdkit>=2022.09
    - networkx
    - more-itertools
    - dacite
    - pyyaml
    - python-graphviz
    - openjdk>=17.0.3
    - prettytable
    - requests
    - bs4 
    - pip:
        - parse
        - glasbey
        # Compatibility runtime for older CPUs without AVX2/BMI2/MOVBE.
        - "polars[rtcompat]>=1.42.1"
